runtime:
  scripts:
    - type: before-request
      code: |-
        let postBody = `{
            "name": {
              "filter_type": "include",
              "value": "7"
            },
            "code": {
              "filter_type": "include",
              "value": "4"
            },
            "description": {
                "filter_type": "include",
                "value": ""
            },
            "type": {
                "filter_type": "include",
                "value": "Service"
            },
            "status": {
                "filter_type": "include",
                "value": ""
            },
            "uom_name":{
                "filter_type": "include",
                "values":[6]
            },
            "item_category_name":{
                "filter_type": "include",
                "value": ""
            },
            "created_at": {
                "filter_type": "include",
                "start_date": "2026-01-05",
                "end_date": "2026-02-28"
            }
        }`;

        // Read the raw request body
        let rawBody = req.getBody().raw;

        // Encode to Base64
        let encodedBody = btoa(postBody);

        // Update the request URL with ?filter=...
        let url = req.getUrl().toString().split("?")[0]; // base URL without query
        req.getUrl() = url + "?filter=" + encodeURIComponent(encodedBody);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
