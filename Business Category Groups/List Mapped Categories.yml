info:
  name: List Mapped Categories
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/business-category-groups/1/categories?per_page=30&sort_col=name&sort_order=desc&description=dd"
  headers:
    - name: branch
      value: "{{branch_id}}"
    - name: Accept
      value: application/json
  params:
    - name: per_page
      value: "30"
      type: query
    - name: sort_col
      value: name
      type: query
    - name: sort_order
      value: desc
      type: query
    - name: name
      value: pack
      type: query
      disabled: true
    - name: description
      value: dd
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
