info:
  name: Top Level Categories LW
  type: http
  seq: 4

http:
  method: GET
  url: "{{base}}/bomCategoriesLW?per_page=2&only_top_level=true&business_category_group_id=1&exclude_branch_mapped_id=1"
  headers:
    - name: branch
      value: "{{branch_id}}"
    - name: Accept
      value: application/json
  params:
    - name: per_page
      value: "2"
      type: query
    - name: name
      value: ano
      type: query
      disabled: true
    - name: only_top_level
      value: "true"
      type: query
    - name: business_category_group_id
      value: "1"
      type: query
    - name: exclude_branch_mapped_id
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
