info:
  name: List
  type: http
  seq: 2

http:
  method: GET
  url: "{{base}}/business-category-groups?per_page=30&sort_col=name&sort_order=asc&category=Car"
  headers:
    - name: branch
      value: "{{branch_id}}"
    - name: Accept
      value: application/json
  params:
    - name: per_page
      value: "30"
      type: query
    - name: sort_col
      value: name
      type: query
    - name: sort_order
      value: asc
      type: query
    - name: name
      value: SIR - II
      type: query
      disabled: true
    - name: category
      value: Car
      type: query
    - name: branch
      value: BSST
      type: query
      disabled: true
    - name: created_by
      value: admin
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
