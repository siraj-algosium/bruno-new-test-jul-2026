info:
  name: Create Saved Filter (enquiry)
  type: http
  seq: 4

http:
  method: POST
  url: "{{base}}/dashboard/saved-filters"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: branch
      value: "{{branch_id}}"
  body:
    type: json
    data: |-
      {
        "page_key": "global-pending",
        "module_key": "enquiry",
        "name": "My Saved Filter",
        "filters": {
          "project_title": { "filter_type": "include", "value": "Pump" },
          "status": { "filter_type": "include", "values": ["pending", "awarded"] }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
