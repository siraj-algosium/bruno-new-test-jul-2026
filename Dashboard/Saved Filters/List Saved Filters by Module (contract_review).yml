info:
  name: List Saved Filters by Module (contract_review)
  type: http
  seq: 2

http:
  method: GET
  url: "{{base}}/dashboard/saved-filters/?module_key=contract_review"
  headers:
    - name: Accept
      value: application/json
    - name: branch
      value: "{{branch_id}}"
  params:
    - name: module_key
      value: contract_review
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
