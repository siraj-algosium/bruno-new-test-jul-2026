info:
  name: Update Widget
  type: http
  seq: 8

http:
  method: PUT
  url: "{{base}}/dashboard/widgets/1"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: branch
      value: "{{branch_id}}"
  body:
    type: json
    data: |-
      {
        "title": "Filtered Records Table Updated",
        "settings": {
          "columns": ["log_no", "project_title", "priority"],
          "per_page": 10,
          "sort_col": "enquiry_reg_date",
          "sort_order": "ASC"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
