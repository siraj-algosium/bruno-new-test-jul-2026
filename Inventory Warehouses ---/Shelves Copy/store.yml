info:
  name: store
  type: http
  seq: 2

http:
  method: POST
  url: "{{base}}/inventory-warehouses/2/zones/4/racks/9/shelves"
  headers:
    - name: Cache-Control
      value: no-cache
    - name: Postman-Token
      value: <calculated when request is sent>
    - name: Content-Type
      value: application/json
    - name: Content-Length
      value: <calculated when request is sent>
    - name: Host
      value: <calculated when request is sent>
    - name: User-Agent
      value: PostmanRuntime/7.39.1
    - name: Accept
      value: "*/*"
    - name: Accept-Encoding
      value: gzip, deflate, br
    - name: Connection
      value: keep-alive
    - name: Branch
      value: "11"
  body:
    type: json
    data: "{\r

      \    \"name\":\"{{shelf_name}}\",\r

      \    \"description\":\"Desc.............................\"\r

      }\r\n"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
