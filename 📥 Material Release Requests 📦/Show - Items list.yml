info:
  name: Show - Items list
  type: http
  seq: 9

http:
  method: GET
  url: "{{base}}/material-release-requests/1/items?per_page=10&page=1&sort_col=required_date&sort_order=asc"
  headers:
    - name: Branch
      value: "11"
  params:
    - name: per_page
      value: "10"
      type: query
    - name: page
      value: "1"
      type: query
    - name: sort_col
      value: required_date
      type: query
      description: |-
        name
        code
        variant_code
        description
        required_date
        requested_quantity
        status
    - name: sort_order
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
