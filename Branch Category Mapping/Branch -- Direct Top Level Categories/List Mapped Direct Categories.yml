info:
  name: List Mapped Direct Categories
  type: http
  seq: 1

http:
  method: GET
  url: "{{base}}/branch/1/categories?per_page=30&search=&sort_col=name&sort_order=asc"
  headers:
    - name: branch
      value: "{{branch_id}}"
    - name: Accept
      value: application/json
  params:
    - name: per_page
      value: "30"
      type: query
    - name: search
      value: ""
      type: query
    - name: sort_col
      value: name
      type: query
    - name: sort_order
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
