info:
  name: Remove One Direct Category Mapping
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{base}}/branch/{{branch}}/categories/{{categoryId}}"
  headers:
    - name: branch
      value: "{{branch_id}}"
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
