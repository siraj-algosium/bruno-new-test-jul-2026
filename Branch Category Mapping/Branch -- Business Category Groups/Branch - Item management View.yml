info:
  name: Branch - Item management View
  type: http
  seq: 1

http:
  method: GET
  url: "{{base}}/branch/11/category-mapping-details"
  headers:
    - name: branch
      value: "{{branch_id}}"
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
