info:
  name: List Mapped Business Category Groups
  type: http
  seq: 2

http:
  method: GET
  url: "{{base}}/branch/1/business-category-groups?per_page=30&sort_col=name&sort_order=asc&name&description"
  headers:
    - name: branch
      value: "{{branch_id}}"
    - name: Accept
      value: application/json
  params:
    - name: per_page
      value: "30"
      type: query
    - name: sort_col
      value: name
      type: query
    - name: sort_order
      value: asc
      type: query
    - name: name
      value: ""
      type: query
    - name: description
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
