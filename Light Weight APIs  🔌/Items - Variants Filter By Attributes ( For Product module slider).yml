info:
  name: Items - Variants Filter By Attributes ( For Product module slider)
  type: http
  seq: 28

http:
  method: GET
  url: "{{base}}/items/55/variantsLW/"
  headers:
    - name: Branch
      value: "11"
    - name: Accept
      value: application/json
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let postBody = `{
            "42" : {
              "filter_type": "include",
              "values": [101]
            }
        }`;

        // Read the raw request body
        let rawBody = req.getBody().raw;

        // Encode to Base64
        let encodedBody = btoa(postBody);

        // Update the request URL with ?filter=...
        let url = req.getUrl().toString().split("?")[0]; // base URL without query
        req.getUrl() = url + "?filter=" + encodeURIComponent(encodedBody);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
